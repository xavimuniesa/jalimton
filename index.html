<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JALIMTON Khaki Automàtic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Quicksand:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dial-black:#0c0d0b;
    --dial-black-2:#17180f;
    --case-steel:#2b2e2c;
    --case-steel-lt:#4a4e4a;
    --lume:#e7ddb8;
    --lume-dim:#b8ad88;
    --khaki:#565a3f;
    --khaki-dk:#3a3d2b;
    --khaki-lt:#8a8f66;
    --cream:#eee6cf;
    --panel-bg:#181a13;
    --panel-line:#3a3d2b;
    --accent-red:#8c3b2e;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;padding:0;
    min-height:100dvh; min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #2a2c1f 0%, #14150f 55%, #0a0a08 100%);
    font-family:'Quicksand',sans-serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100dvh; min-height:100vh;
    padding: clamp(14px,4vw,26px) clamp(14px,4vw,26px) clamp(24px,6vw,40px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: clamp(18px,4vh,30px);
  }

  /* ---------- HEADER ---------- */
  .app-header{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding: 6px 4px 0;
  }
  .app-header .brand-mini{
    font-size:11px;
    letter-spacing:.28em;
    color:var(--khaki-lt);
    text-transform:uppercase;
  }
  .app-header .brand-sub{
    font-size:11px;
    letter-spacing:.12em;
    color:#6a6e56;
    font-family:'JetBrains Mono',monospace;
  }

  /* ---------- WATCH ---------- */
  .watch-wrap{
    position:relative;
    width: clamp(260px, 88vw, 460px);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .case-svg-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    filter: drop-shadow(0 14px 26px rgba(0,0,0,.6));
  }

  .hand{
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  .hand-hour{ fill:var(--lume); }
  .hand-min{ fill:var(--lume); }
  .hand-sec{ fill:var(--accent-red); }

  .date-digit{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    fill:#111;
  }

  /* ---------- INSTRUMENTS ---------- */
  .instruments{
    width:100%;
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .instrument{
    background: linear-gradient(160deg, var(--panel-bg), #101208);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding: 10px 12px;
    position:relative;
    overflow:hidden;
  }
  .instrument::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:3px;height:100%;
    background:var(--khaki-lt);
    opacity:.7;
  }
  .instrument .i-label{
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--khaki-lt);
    margin-bottom:4px;
  }
  .instrument .i-value{
    font-family:'JetBrains Mono',monospace;
    font-size: clamp(18px,5vw,22px);
    font-weight:700;
    color:var(--lume);
    line-height:1.1;
    display:flex;
    align-items:baseline;
    gap:3px;
  }
  .instrument .i-value .unit{
    font-size:11px;
    font-weight:400;
    color:var(--khaki-lt);
  }
  .instrument.loc .i-value{
    font-size: clamp(13px,3.6vw,15px);
    font-weight:600;
    font-family:'Oswald',sans-serif;
    letter-spacing:.01em;
  }
  .instrument .i-sub{
    margin-top:3px;
    font-size:10px;
    color:#6a6e56;
    font-family:'JetBrains Mono',monospace;
  }

  /* ---------- CALENDAR ---------- */
  .calendar-card{
    width:100%;
    background: linear-gradient(160deg, var(--panel-bg), #101208);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding: 14px 14px 16px;
    position:relative;
  }
  .calendar-card::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:3px;height:100%;
    background:var(--khaki-lt);
    opacity:.7;
  }
  .cal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .cal-title{
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--khaki-lt);
  }
  .cal-month{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--lume);
    text-transform:capitalize;
  }
  .cal-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-dow{
    text-align:center;
    font-size:9px;
    letter-spacing:.06em;
    color:#6a6e56;
    font-family:'JetBrains Mono',monospace;
    padding-bottom:4px;
    text-transform:uppercase;
  }
  .cal-day{
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size: clamp(10px,3vw,12px);
    color:#8b8f74;
    border-radius:3px;
  }
  .cal-day.empty{ visibility:hidden; }
  .cal-day.today{
    background:var(--lume);
    color:#14150f;
    font-weight:700;
    box-shadow:0 0 0 1px var(--khaki-lt);
  }

  /* ---------- LANDSCAPE (iPhone) ---------- */
  @media (orientation: landscape) and (max-height: 500px){
    .app{
      flex-direction:row;
      align-items:center;
      justify-content:center;
      gap: clamp(20px,5vw,40px);
      padding: 10px clamp(20px,6vw,50px);
      max-width:900px;
    }
    .app-header{ display:none; }
    .watch-wrap{ width: clamp(220px,34vw,320px); aspect-ratio:1/1; }
    .right-col{
      display:flex;
      flex-direction:column;
      gap:10px;
      flex:1;
      max-width:420px;
    }
    .instruments{ grid-template-columns: repeat(4,1fr); }
    .instrument.loc{ grid-column: span 2; }
  }
  .right-col{ width:100%; display:contents; }
  @media (orientation: landscape) and (max-height: 500px){
    .right-col{ display:flex; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <span class="brand-mini">HAMILTON</span>
    <span class="brand-sub" id="statusClock">--:--:--</span>
  </div>

  <div class="watch-wrap">
    <div class="case-svg-wrap">
      <svg viewBox="0 0 400 400" width="100%" height="100%">
        <defs>
          <radialGradient id="dialGrad" cx="42%" cy="36%" r="78%">
            <stop offset="0%" stop-color="var(--dial-black-2)"/>
            <stop offset="70%" stop-color="var(--dial-black)"/>
            <stop offset="100%" stop-color="#000"/>
          </radialGradient>
          <radialGradient id="caseGrad" cx="30%" cy="24%" r="85%">
            <stop offset="0%" stop-color="#767c73"/>
            <stop offset="30%" stop-color="#454a45"/>
            <stop offset="65%" stop-color="#131512"/>
            <stop offset="100%" stop-color="#3d413c"/>
          </radialGradient>
          <radialGradient id="bezelGrad" cx="32%" cy="26%" r="85%">
            <stop offset="0%" stop-color="#585d55"/>
            <stop offset="28%" stop-color="#232520"/>
            <stop offset="62%" stop-color="#040404"/>
            <stop offset="100%" stop-color="#2e312c"/>
          </radialGradient>
          <linearGradient id="handGradLume" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#a8996b"/>
            <stop offset="45%" stop-color="#f5edd4"/>
            <stop offset="100%" stop-color="#93835a"/>
          </linearGradient>
          <linearGradient id="handGradRed" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5e241a"/>
            <stop offset="45%" stop-color="#b1503c"/>
            <stop offset="100%" stop-color="#4a1c14"/>
          </linearGradient>
          <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.38"/>
            <stop offset="30%" stop-color="#fff" stop-opacity="0.10"/>
            <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <clipPath id="dialClip"><circle cx="200" cy="200" r="163"/></clipPath>

          <filter id="emboss" x="-60%" y="-60%" width="220%" height="220%">
            <feDropShadow dx="0.7" dy="1" stdDeviation="0" flood-color="#000" flood-opacity="0.6"/>
            <feDropShadow dx="-0.4" dy="-0.5" stdDeviation="0" flood-color="#fff" flood-opacity="0.22"/>
          </filter>
          <filter id="handShadow" x="-100%" y="-100%" width="300%" height="300%">
            <feDropShadow dx="1.4" dy="2" stdDeviation="1.1" flood-color="#000" flood-opacity="0.5"/>
          </filter>
          <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.2"/>
          </filter>
        </defs>

        <!-- CASE -->
        <circle cx="200" cy="200" r="196" fill="url(#caseGrad)"/>
        <circle cx="200" cy="200" r="196" fill="none" stroke="#0a0a0a" stroke-width="2"/>
        <circle cx="200" cy="200" r="188" fill="none" stroke="#7a8078" stroke-width="1.5" stroke-opacity="0.35"/>

        <!-- BEZEL -->
        <circle cx="200" cy="200" r="178" fill="url(#bezelGrad)"/>
        <circle cx="200" cy="200" r="178" fill="none" stroke="#000" stroke-width="1"/>
        <circle cx="200" cy="200" r="167" fill="none" stroke="#000" stroke-width="4" stroke-opacity="0.4" filter="url(#softBlur)"/>

        <!-- DIAL -->
        <circle cx="200" cy="200" r="163" fill="url(#dialGrad)"/>
        <circle cx="200" cy="200" r="163" fill="none" stroke="#000" stroke-width="1.5"/>

        <!-- Railroad minute track (60 ticks) -->
        <g id="minuteTrack" stroke="var(--lume-dim)"></g>

        <!-- Track numerals every 5 min -->
        <g id="trackNumerals" fill="var(--khaki-lt)" font-family="Quicksand, sans-serif" font-weight="600" font-size="9" text-anchor="middle" filter="url(#emboss)"></g>

        <!-- Inner 24h ring -->
        <circle cx="200" cy="200" r="112" fill="none" stroke="#2a2c22" stroke-width="1"/>
        <g id="innerTicks" stroke="var(--khaki-lt)"></g>
        <g id="innerNumerals" fill="var(--khaki-lt)" font-family="Quicksand, sans-serif" font-size="13" font-weight="600" text-anchor="middle" filter="url(#emboss)"></g>

        <!-- Outer Arabic hour numerals (SVG built by JS, minus 3 for date window) -->
        <g id="hourNumerals" fill="var(--lume)" font-family="Quicksand, sans-serif" font-weight="700" text-anchor="middle" filter="url(#emboss)"></g>

        <!-- Date window at 3 o'clock -->
        <g id="dateWindow">
          <rect x="277" y="188" width="26" height="24" rx="1" fill="#ece4cc" stroke="#0a0a0a" stroke-width="1.5"/>
          <text id="dateDigit" class="date-digit" x="290" y="206" font-size="15" text-anchor="middle">--</text>
        </g>

        <!-- Brand -->
        <text x="200" y="152" text-anchor="middle" font-family="'Montserrat Alternate', cursive" font-weight="400" font-size="20" letter-spacing="3" fill="var(--cream)" stroke="var(--cream)" stroke-width="0.6" filter="url(#emboss)">HAMILTON</text>
        <text x="200" y="238" text-anchor="middle" font-family="Quicksand, sans-serif" font-weight="600" font-size="13" letter-spacing="4" fill="var(--khaki-lt)" filter="url(#emboss)">KHAKI</text>
        <text x="200" y="255" text-anchor="middle" font-family="Quicksand, sans-serif" font-weight="600" font-size="13" letter-spacing="3" fill="var(--khaki-lt)" filter="url(#emboss)">AUTOMATIC</text>
        <text x="200" y="292" text-anchor="middle" font-family="'Poiret One', cursive" font-size="9" letter-spacing="2.5" fill="#6a6e56">SWISS MADE</text>

        <!-- Hands -->
        <g id="hourHand" class="hand hand-hour" transform="translate(200,200) rotate(0)" filter="url(#handShadow)">
          <path d="M -4.5,4 L -3,-70 L 0,-78 L 3,-70 L 4.5,4 Z" fill="url(#handGradLume)" stroke="#2a2416" stroke-width="0.6"/>
        </g>
        <g id="minHand" class="hand hand-min" transform="translate(200,200) rotate(0)" filter="url(#handShadow)">
          <path d="M -3.2,4 L -2,-102 L 0,-110 L 2,-102 L 3.2,4 Z" fill="url(#handGradLume)" stroke="#2a2416" stroke-width="0.6"/>
        </g>
        <g id="secHand" class="hand hand-sec" transform="translate(200,200) rotate(0)" filter="url(#handShadow)">
          <path d="M -1,20 L -1,-118 L 1,-118 L 1,20 Z" fill="url(#handGradRed)"/>
          <circle cx="0" cy="-98" r="4" fill="none" stroke="var(--accent-red)" stroke-width="1.4"/>
        </g>

        <circle cx="200" cy="200" r="7" fill="#111" stroke="var(--lume)" stroke-width="1.5"/>
        <circle cx="200" cy="200" r="3" fill="var(--lume)"/>

        <!-- Crystal glass reflection -->
        <g clip-path="url(#dialClip)" style="pointer-events:none">
          <ellipse cx="150" cy="128" rx="145" ry="95" fill="url(#glassGrad)" transform="rotate(-24 150 128)"/>
        </g>
        <path d="M 78,118 A 178,178 0 0 1 322,118" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="right-col">
    <div class="instruments">
      <div class="instrument temp">
        <div class="i-label">Temperatura</div>
        <div class="i-value" id="valTemp">--<span class="unit">°C</span></div>
      </div>
      <div class="instrument hum">
        <div class="i-label">Humitat</div>
        <div class="i-value" id="valHum">--<span class="unit">%</span></div>
      </div>
      <div class="instrument feels">
        <div class="i-label">Sensació tèrmica</div>
        <div class="i-value" id="valFeels">--<span class="unit">°C</span></div>
      </div>
      <div class="instrument loc">
        <div class="i-label">Localització</div>
        <div class="i-value" id="valLoc">Cercant…</div>
      </div>
    </div>

    <div class="calendar-card">
      <div class="cal-header">
        <span class="cal-title">Calendari</span>
        <span class="cal-month" id="calMonthLabel">—</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const cx = 200, cy = 200;

  function polar(r, deg){
    const rad = (deg - 90) * Math.PI / 180;
    return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
  }

  /* ---------- Build railroad minute track ---------- */
  const trackG = document.getElementById('minuteTrack');
  for(let i=0;i<60;i++){
    const deg = i*6;
    const isFive = i % 5 === 0;
    const r1 = 163, r2 = isFive ? 150 : 156;
    const p1 = polar(r1, deg), p2 = polar(r2, deg);
    const line = document.createElementNS(NS,'line');
    line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
    line.setAttribute('stroke-width', isFive ? 2 : 1);
    trackG.appendChild(line);
  }

  /* ---------- Track numerals (5,10,...60) rotated like chronograph tachymeter style ---------- */
  const trackNumG = document.getElementById('trackNumerals');
  for(let i=5;i<=60;i+=5){
    const deg = i*6;
    const p = polar(140, deg);
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x', p.x); t.setAttribute('y', p.y+3);
    t.textContent = i;
    trackNumG.appendChild(t);
  }

  /* ---------- Inner 24h ring ticks + numerals (13-24, skipping 12/24 overlap area kept) ---------- */
  const innerTicksG = document.getElementById('innerTicks');
  for(let i=0;i<24;i++){
    const deg = i*15;
    const p1 = polar(112, deg), p2 = polar(105, deg);
    const line = document.createElementNS(NS,'line');
    line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
    line.setAttribute('stroke-width', 1);
    innerTicksG.appendChild(line);
  }
  const innerNumG = document.getElementById('innerNumerals');
  const innerLabels = {0:24,1:13,2:14,3:15,4:16,5:17,6:18,7:19,8:20,9:21,10:22,11:23};
  for(let h=0; h<12; h++){
    const deg = h*30;
    const p = polar(92, deg);
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x', p.x); t.setAttribute('y', p.y+4.5);
    t.textContent = innerLabels[h];
    innerNumG.appendChild(t);
  }

  /* ---------- Outer Arabic hour numerals (skip 3 -> date window) ---------- */
  const hourNumG = document.getElementById('hourNumerals');
  const sizes = {12:26, 6:26};
  for(let h=1; h<=12; h++){
    if(h===3) continue;
    const deg = h*30;
    const p = polar(133, deg);
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x', p.x); t.setAttribute('y', p.y + 9);
    t.setAttribute('font-size', sizes[h] || 24);
    t.textContent = h;
    hourNumG.appendChild(t);
  }

  /* ---------- Clock update ---------- */
  const hourHand = document.getElementById('hourHand');
  const minHand = document.getElementById('minHand');
  const secHand = document.getElementById('secHand');
  const dateDigit = document.getElementById('dateDigit');
  const statusClock = document.getElementById('statusClock');
  let lastDay = null;

  function tick(){
    const now = new Date();
    const ms = now.getMilliseconds();
    const s = now.getSeconds() + ms/1000;
    const m = now.getMinutes() + s/60;
    const h = (now.getHours() % 12) + m/60;

    hourHand.setAttribute('transform', `translate(${cx},${cy}) rotate(${h*30})`);
    minHand.setAttribute('transform', `translate(${cx},${cy}) rotate(${m*6})`);
    secHand.setAttribute('transform', `translate(${cx},${cy}) rotate(${s*6})`);

    const day = now.getDate();
    if(day !== lastDay){
      dateDigit.textContent = String(day).padStart(2,'0');
      lastDay = day;
      buildCalendar(now);
    }

    statusClock.textContent = now.toLocaleTimeString('ca-ES', {hour:'2-digit',minute:'2-digit',second:'2-digit'});

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- Calendar widget ---------- */
  const calGrid = document.getElementById('calGrid');
  const calMonthLabel = document.getElementById('calMonthLabel');
  const dows = ['DL','DT','DC','DJ','DV','DS','DG'];

  function buildCalendar(refDate){
    calGrid.innerHTML = '';
    dows.forEach(d=>{
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      calGrid.appendChild(el);
    });

    const year = refDate.getFullYear();
    const month = refDate.getMonth();
    const today = refDate.getDate();

    calMonthLabel.textContent = refDate.toLocaleDateString('ca-ES', {month:'long', year:'numeric'});

    const firstDay = new Date(year, month, 1);
    let startOffset = firstDay.getDay(); // 0=Sun
    startOffset = (startOffset === 0) ? 6 : startOffset - 1; // make Monday=0

    const daysInMonth = new Date(year, month+1, 0).getDate();

    for(let i=0;i<startOffset;i++){
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      calGrid.appendChild(el);
    }
    for(let d=1; d<=daysInMonth; d++){
      const el = document.createElement('div');
      el.className = 'cal-day' + (d===today ? ' today' : '');
      el.textContent = d;
      calGrid.appendChild(el);
    }
  }
  buildCalendar(new Date());

  /* ---------- Weather + location (Open-Meteo + BigDataCloud) ---------- */
  const valTemp = document.getElementById('valTemp');
  const valHum = document.getElementById('valHum');
  const valFeels = document.getElementById('valFeels');
  const valLoc = document.getElementById('valLoc');

  function fmtTemp(v){ return (v===null||v===undefined||isNaN(v)) ? '--' : Math.round(v); }

  async function loadWeather(lat, lon){
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature&timezone=auto`;
      const res = await fetch(url);
      const data = await res.json();
      const c = data.current || {};
      valTemp.innerHTML = `${fmtTemp(c.temperature_2m)}<span class="unit">°C</span>`;
      valHum.innerHTML = `${fmtTemp(c.relative_humidity_2m)}<span class="unit">%</span>`;
      valFeels.innerHTML = `${fmtTemp(c.apparent_temperature)}<span class="unit">°C</span>`;
    }catch(e){
      valTemp.textContent = 'N/D';
      valHum.textContent = 'N/D';
      valFeels.textContent = 'N/D';
    }
  }

  async function loadLocation(lat, lon){
    try{
      const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ca`;
      const res = await fetch(url);
      const data = await res.json();
      const place = data.locality || data.city || data.principalSubdivision || 'Ubicació desconeguda';
      valLoc.textContent = place;
    }catch(e){
      valLoc.textContent = 'N/D';
    }
  }

  function initGeo(){
    if(!navigator.geolocation){
      valLoc.textContent = 'Geolocalització no disponible';
      // Fallback: Barcelona
      loadWeather(41.3874, 2.1686);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        loadWeather(latitude, longitude);
        loadLocation(latitude, longitude);
      },
      err => {
        valLoc.textContent = 'Ubicació denegada';
        loadWeather(41.3874, 2.1686); // fallback Barcelona
      },
      { enableHighAccuracy:false, timeout:8000 }
    );
  }
  initGeo();

})();
